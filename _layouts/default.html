<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f4">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('ax-study-theme') || 'light'; } catch (error) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="AX Study 홈">
        <span class="brand-mark" aria-hidden="true">AX</span><span>AX <span class="brand-light">STUDY</span></span>
      </a>
      <div class="header-tools">
        <nav aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>작업대</a>
          <a href="{{ '/portfolio/' | relative_url }}" {% if page.url == '/portfolio/' %}aria-current="page"{% endif %}>실험 노트</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a>
        </nav>
        <a class="github-link" href="https://github.com/hkkoo/ax-study">GitHub <span aria-hidden="true">↗</span></a>
        <button class="theme-toggle" type="button" aria-label="어두운 테마로 전환" title="테마 전환"><span aria-hidden="true">◐</span></button>
      </div>
    </div>
  </header>
  <main class="site-main">
    {% if page.url == '/' %}
      {{ content }}
    {% else %}
      <div class="content-shell">{{ content }}</div>
    {% endif %}
  </main>
  <footer class="site-footer"><div class="shell"><span>AX STUDY · LEARN, BUILD, VERIFY</span><span>일의 틈에서 다음 실험을 찾습니다.</span></div></footer>
</body>
</html>
